name: sig_ensoa
description: "ERP de l'ENSOA — scolarité et soutien technique, une seule application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Versions alignées sur celles du module scolarité, les plus récentes des deux
# applications d'origine. Le module logistique est repris dessus : riverpod
# 2 → 3, go_router 14 → 17 et fl_chart 0.69 → 1.2 sont le gros du travail
# mécanique de la fusion côté Dart.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Socle
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  intl: ^0.20.3

  # Sécurité — repris du module logistique : déverrouillage biométrique et
  # stockage du matricule entre deux sessions.
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6
  uuid: ^4.5.1

  # Présentation
  google_fonts: ^8.2.1

  # La sonnerie des notifications. `SystemSound.play` n'y suffirait pas :
  # l'alerte système du bureau est ignorée sur Android, où se trouve
  # justement celui qu'il faut prévenir.
  audioplayers: ^6.5.1
  fl_chart: ^1.2.0

  # Documents : bulletins, listes, bons de distribution
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.6
  file_picker: ^10.3.4
  image_picker: ^1.1.2

  # Notifications poussées — Android seulement : Firebase Messaging ne couvre
  # pas Windows, et le code s.en désarme de lui-même.
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sons/
    # Police de repli des documents imprimés. Elle n'est pas déclarée sous
    # `fonts:` — l'interface ne s'en sert pas ; c'est la bibliothèque PDF qui
    # en lit les octets, pour que les accents et le tiret cadratin s'impriment
    # là où Arial n'existe pas. Voir `pdf_fonts.dart`.
    - assets/fonts/

# Icône de l'application — une seule source pour la tablette et le poste de
# travail. L'écusson de l'ENSOA sert des deux côtés : l'application n'a qu'une
# identité, elle ne doit pas s'appeler autrement selon l'appareil.
flutter_launcher_icons:
  image_path: "assets/images/icone_ensoa.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icone_ensoa.png"
  windows:
    generate: true
    image_path: "assets/images/icone_ensoa.png"
    icon_size: 256
  # L'identité web (PWA) : mêmes armoiries, pour que l'icône ajoutée à l'écran
  # d'accueil ou installée sur le poste soit celle de l'ENSOA et non le logo
  # Flutter par défaut. Le fond de l'icône masquable reprend le bleu marine.
  web:
    generate: true
    image_path: "assets/images/icone_ensoa.png"
    background_color: "#101F3C"
    theme_color: "#101F3C"
